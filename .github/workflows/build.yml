name: Build All Platforms

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  export-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          ANDROID_SDK_ROOT=${{ runner.tool_cache }}/android-sdk
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          # Download cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          # Accept licenses and install SDK components
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;23.2.8568313"

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore android.keystore -alias blingo -keyalg RSA -keysize 2048 -validity 10000 -storepass blingo123 -keypass blingo123 -dname "CN=AK & Co., OU=BLINGO, O=akilluminati47, L=Unknown, S=Unknown, C=US"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          unzip -o -j -q Godot_v4.7.1-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.7.1.stable

      - name: Create Build Dirs
        run: mkdir -p build/windows build/linux build/web build/android

      - name: Build Windows
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --export-release "Windows Desktop" build/windows/BLINGO.exe

      - name: Build Linux
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --export-release "Linux/X11" build/linux/BLINGO.x86_64

      - name: Build Web
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --export-release "Web" build/web/index.html
        continue-on-error: true

      - name: Build Android
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --export-release "Android" build/android/BLINGO.apk

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: BLINGO-Windows
          path: build/windows/

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: BLINGO-Linux
          path: build/linux/

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: BLINGO-Web
          path: build/web/

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: BLINGO-Android
          path: build/android/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ github.run_number }}
          name: Godot Build ${{ github.run_number }}
          files: |
            build/windows/BLINGO.exe
            build/linux/BLINGO.x86_64
            build/android/BLINGO.apk
          draft: false
          prerelease: true
